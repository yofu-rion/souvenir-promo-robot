; M5Stack リモコン（角度調整・動作開始）。Pi と Bluetooth LE でつなぐ。
;   書き込み: ~/.venvs/pio/bin/pio run -d m5remote -e core2 -t upload   （CoreS3 は -e cores3）
; 通信の取り決めは src/main.cpp の先頭と robot/srr/remote.py に書いてある。

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.2.5
    h2zero/NimBLE-Arduino@^1.4.3
    bblanchon/ArduinoJson@^7.3.0

[env:core2]
board = m5stack-core2

[env:cores3]
board = m5stack-cores3
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
